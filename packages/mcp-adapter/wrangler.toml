name = "tokento-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Default vars target PRODUCTION. Local development uses [env.dev] via
# `wrangler dev --env dev`, so a plain `wrangler deploy` can never point
# production traffic at localhost.
[vars]
API_BASE_URL = "https://api.tokento.com"
ALLOWED_ORIGINS = ""

[env.dev.vars]
API_BASE_URL = "http://localhost:4000"
ALLOWED_ORIGINS = "http://localhost:3100"

# MCP_AUTH_TOKEN is a secret, never a var:
#   wrangler secret put MCP_AUTH_TOKEN
